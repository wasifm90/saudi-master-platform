<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin & CMS Portal | Saudi Master × ULMA Construction</title>
  <!-- Pre-Compiled Static High-Performance Tailwind CSS (Zero Runtime JIT Overhead) -->
  <link rel="stylesheet" href="css/styles.css"/>

  <style>
    body {
      background-color: #F5F0E6;
      color: #25231F;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .tab-active {
      background-color: #25231F !important;
      color: #FAF8F3 !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-desert-ivory">

  <!-- ADMIN TOPBAR -->
  <header class="bg-charcoal text-content-offwhite px-6 py-4 flex flex-wrap items-center justify-between border-b border-white/10 shadow-md gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded bg-primary-gold text-charcoal flex items-center justify-center font-display font-bold text-lg shadow-sm">
        SM
      </div>
      <div>
        <h1 class="font-display font-bold text-sm sm:text-base uppercase tracking-wider text-white">
          Saudi Master × ULMA Construction | CMS Portal
        </h1>
        <span class="text-[11px] text-soft-sand/70 font-display">Full Production Content & Relational Management Interface</span>
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs font-display">
      <button onclick="resetFactoryDefaults()" class="px-3 py-1.5 rounded bg-red-950/60 border border-red-700/60 text-red-300 hover:bg-red-900 transition-colors flex items-center gap-1.5" title="Clear all local CMS overrides and restore factory data">
        <span class="material-symbols-outlined text-sm">restart_alt</span>
        <span class="hidden sm:inline">Reset Factory Defaults</span>
      </button>
      <a href="/" target="_blank" class="px-3.5 py-1.5 rounded bg-white/10 text-soft-sand hover:text-white flex items-center gap-1.5 transition-colors border border-white/10">
        <span class="material-symbols-outlined text-sm">open_in_new</span>
        <span>View Public Website</span>
      </a>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-green-950/60 border border-green-700/50 text-green-300">
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        <span class="font-bold">Live Synced</span>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="bg-soft-sand border-b border-divider-color px-6 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
    <button onclick="setTab('products')" id="tab-btn-products" class="tab-active px-3.5 py-2 rounded font-display text-xs font-bold uppercase transition-all shrink-0">
      Products Manager
    </button>
    <button onclick="setTab('hero')" id="tab-btn-hero" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Hero & Video Banner
    </button>
    <button onclick="setTab('sections')" id="tab-btn-sections" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Section Visibility
    </button>
    <button onclick="setTab('geometries')" id="tab-btn-geometries" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Geometries CMS
    </button>
    <button onclick="setTab('projects')" id="tab-btn-projects" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Projects Portfolio
    </button>
    <button onclick="setTab('processes')" id="tab-btn-processes" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      KSA Manufacturing
    </button>
    <button onclick="setTab('leads')" id="tab-btn-leads" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Inbound RFQs (<span id="rfqBadgeCount">0</span>)
    </button>
    <button onclick="setTab('settings')" id="tab-btn-settings" class="px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0">
      Site Settings
    </button>
  </div>

  <!-- MAIN ADMIN BODY -->
  <main class="max-w-7xl mx-auto w-full p-6 flex-1 flex flex-col gap-6" id="adminMainContainer">
    <!-- Populated by JS -->
  </main>

  <script src="js/seed_data.js"></script>

      },
      {

        name_en: 'Slab & Deck',
        name_ar: 'أسقف وبلاطات',
        code: 'ULMA CC-4 Drop-Head + SM Props',
        title_en: 'Rapid Post-Tensioned & Flat Slabs',

        desc_ar: 'جمالونات فولاذية متطورة للجسور المعلقة والأنفاق تتيح فتح مسارات مرورية عريضة أسفل منطقة العمل دون إغلاق الطرق.',
        image: 'images/projects/infrastructure-bridge.jpg',
        p1_label_en: 'Leg Capacity',
        p1_label_ar: 'تحمل القائم',
        p1_val: '500 kN / Leg',
        p2_label_en: 'Clear Span',
        p2_label_ar: 'البحور المفتوحة',
        p2_val: 'Up to 24m'

    ];

    function loadOverrides() {
      if (localStorage.getItem('sm_products_override')) {
        try { db.products = JSON.parse(localStorage.getItem('sm_products_override')); } catch(e) {}
      }
      if (localStorage.getItem('sm_site_override')) {
        try { db.site = JSON.parse(localStorage.getItem('sm_site_override')); } catch(e) {}
      }
      if (localStorage.getItem('sm_projects_override')) {
        try { db.projects = JSON.parse(localStorage.getItem('sm_projects_override')); } catch(e) {}
      }
      if (localStorage.getItem('sm_processes_override')) {
        try { db.processes = JSON.parse(localStorage.getItem('sm_processes_override')); } catch(e) {}
      }
    }

    loadOverrides();

    document.addEventListener('DOMContentLoaded', () => {
      updateRfqCount();
      renderCurrentTab();
    });

    function updateRfqCount() {
      const el = document.getElementById('rfqBadgeCount');
      if (el && db.leads) el.innerText = db.leads.length;
    }

    function setTab(tab) {
      currentTab = tab;
      ['products', 'hero', 'sections', 'geometries', 'projects', 'processes', 'leads', 'settings'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (btn) {
          if (t === tab) {
            btn.className = 'tab-active px-3.5 py-2 rounded font-display text-xs font-bold uppercase transition-all shrink-0';
          } else {
            btn.className = 'px-3.5 py-2 rounded font-display text-xs font-bold uppercase text-charcoal hover:bg-card-surface transition-all shrink-0';
          }
        }
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('adminMainContainer');
      if (!container) return;

      if (currentTab === 'products') {
        container.innerHTML = `
          <div class="flex flex-wrap items-center justify-between border-b border-divider-color pb-4 gap-4">
            <div>
              <h2 class="text-xl font-display font-bold uppercase text-charcoal">Systems & Product Inventory (${db.products ? db.products.length : 0})</h2>
              <p class="text-xs text-muted-brown">Configure product photos, SKUs, classifications, and bilingual technical specifications.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="addNewProductModal()" class="px-4 py-2 bg-charcoal text-white rounded font-display text-xs font-bold uppercase tracking-wider hover:bg-primary-gold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-sm">add_box</span>
                <span>Add New System</span>
              </button>
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-divider-color bg-card-surface shadow-sm">
            <table class="w-full text-left text-xs">
              <thead class="bg-desert-ivory text-muted-brown uppercase font-display border-b border-divider-color">
                <tr>
                  <th class="py-3 px-4">Preview</th>
                  <th class="py-3 px-4">SKU</th>
                  <th class="py-3 px-4">English Title</th>
                  <th class="py-3 px-4 font-arabic" dir="rtl">الاسم العربي</th>
                  <th class="py-3 px-4">Classification</th>
                  <th class="py-3 px-4">Commercial</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${(db.products || []).map(p => `
                  <tr class="border-b border-divider-color hover:bg-desert-ivory/40">
                    <td class="py-2 px-4">
                      <img src="${p.main_image || p.hero_image}" alt="${p.sku}" class="w-12 h-10 object-cover rounded border border-divider-color bg-charcoal" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' width=\'48\' height=\'40\' viewBox=\'0 0 48 40\'%3E%3Crect width=\'48\' height=\'40\' fill=\'%231C2024\'/ %3E%3Ctext x=\'24\' y=\'24\' font-size=\'8\' fill=\'%23B58A52\' text-anchor=\'middle\'%3ECAD%3C/text%3E%3C/svg%3E'"/>
                    </td>
                    <td class="py-3 px-4 font-display font-bold text-primary-gold">${p.sku}</td>
                    <td class="py-3 px-4 font-semibold text-charcoal">${p.name_en}</td>
                    <td class="py-3 px-4 font-arabic text-charcoal" dir="rtl">${p.name_ar}</td>
                    <td class="py-3 px-4">
                      <span class="px-2 py-0.5 rounded text-[10px] font-display font-bold ${p.class_code === 'LOCAL' ? 'bg-primary-gold text-white' : 'bg-ulma-orange text-white'}">
                        ${p.class_code}
                      </span>
                    </td>
                    <td class="py-3 px-4 text-[11px] font-display">
                      ${p.sales_available ? 'Sales' : ''} ${p.rental_available ? '+ Rental' : ''}
                    </td>
                    <td class="py-3 px-4 text-right space-x-1">
                      <button onclick="editProductPrompt(${p.id})" class="px-3 py-1 bg-charcoal text-white rounded font-display text-[11px] font-bold uppercase hover:bg-primary-gold">
                        Edit
                      </button>
                      <button onclick="deleteProductPrompt(${p.id})" class="px-2.5 py-1 bg-red-100 text-red-700 rounded font-display text-[11px] font-bold uppercase hover:bg-red-200">
                        Delete
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        let hero = defaultHeroConfig;
        if (localStorage.getItem('sm_hero_override')) {
          try { hero = Object.assign({}, defaultHeroConfig, JSON.parse(localStorage.getItem('sm_hero_override'))); } catch(e) {}

        container.innerHTML = `
          <div class="border-b border-divider-color pb-3">
            <h2 class="text-xl font-display font-bold uppercase text-charcoal">Hero Section & Video Banner CMS</h2>
            <p class="text-xs text-muted-brown">Configure the cinematic banner, video feed stream, fallback photography, and bilingual headlines.</p>
          </div>

          <form onsubmit="saveHeroConfig(event)" class="bg-card-surface border border-divider-color rounded-xl p-6 shadow-sm flex flex-col gap-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="flex flex-col gap-1">
                <label class="text-xs font-display font-semibold uppercase text-muted-brown">Hero Headline (English - HTML supported)</label>
                <textarea rows="3" id="hero_title_en" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm font-display">${hero.title_en}</textarea>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs font-display font-semibold uppercase text-muted-brown font-arabic" dir="rtl">عنوان الواجهة (عربي - يدعم وسوم التنسيق)</label>
                <textarea rows="3" id="hero_title_ar" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm font-arabic" dir="rtl">${hero.title_ar}</textarea>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="flex flex-col gap-1">
                <label class="text-xs font-display font-semibold uppercase text-muted-brown">Hero Subcopy (English)</label>
                <textarea rows="3" id="hero_sub_en" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm">${hero.subcopy_en}</textarea>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs font-display font-semibold uppercase text-muted-brown font-arabic" dir="rtl">النص التوضيحي للواجهة (عربي)</label>
                <textarea rows="3" id="hero_sub_ar" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm font-arabic" dir="rtl">${hero.subcopy_ar}</textarea>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="flex flex-col gap-1">
                <label class="text-xs font-display font-semibold uppercase text-muted-brown">Cinematic Hero Video URL (MP4 stream)</label>
                <input type="url" id="hero_video_url" value="${hero.video_url}" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm"/>

              </div>
              <div class="flex flex-col gap-1">

                <input type="url" id="hero_poster_url" onchange="document.getElementById('heroPosterPreview').src=this.value" value="${hero.poster_url}" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm"/>
                <div class="mt-2 flex items-center gap-3">
                  <img id="heroPosterPreview" src="${hero.poster_url}" alt="Hero Poster Preview" class="h-16 w-32 object-cover rounded border border-divider-color bg-charcoal"/>
                  <span class="text-[11px] text-muted-brown">Displayed behind the video and while streaming loads.</span>
                </div>
              </div>
            </div>

            <div class="border-t border-divider-color pt-4">
              <h4 class="font-display font-bold text-xs uppercase text-charcoal mb-3">Trust Strip Badges</h4>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-display font-semibold uppercase text-muted-brown">IKTVA Badge</label>
                  <input type="text" id="hero_badge_iktva" value="${hero.iktva}" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm"/>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-display font-semibold uppercase text-muted-brown">Euro Norm Badge</label>
                  <input type="text" id="hero_badge_euro" value="${hero.euro}" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm"/>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-display font-semibold uppercase text-muted-brown">Dispatch Speed Badge</label>
                  <input type="text" id="hero_badge_dispatch" value="${hero.dispatch}" class="px-3 py-2 bg-desert-ivory border border-divider-color rounded text-sm"/>
                </div>
              </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-divider-color">
              <button type="submit" class="px-6 py-2.5 bg-charcoal text-white rounded font-display text-xs font-bold uppercase tracking-wider hover:bg-primary-gold transition-colors shadow-sm">
                Save Hero Configuration
              </button>
            </div>

      const nameAr = document.getElementById('m_name_ar').value;
      const sumEn = document.getElementById('m_sum_en').value;
      const sumAr = document.getElementById('m_sum_ar').value;
      const whatEn = document.getElementById('m_what_en').value;
      const whatAr = document.getElementById('m_what_ar').value;
      const usedEn = document.getElementById('m_used_en').value;
      const usedAr = document.getElementById('m_used_ar').value;
      const sales = document.getElementById('m_sales').checked ? 1 : 0;
      const rental = document.getElementById('m_rental').checked ? 1 : 0;

      if (existingId) {
        const p = db.products.find(x => x.id === existingId);
        if (p) {
          p.sku = sku;
          p.class_code = classCode;
          p.cat_slug = catSlug;
          p.main_image = imgUrl;
          p.hero_image = imgUrl;
          p.name_en = nameEn;
          p.name_ar = nameAr;
          p.short_summary_en = sumEn;
          p.short_summary_ar = sumAr;
          p.what_is_it_en = whatEn;
          p.what_is_it_ar = whatAr;
          p.what_is_used_for_en = usedEn;
          p.what_is_used_for_ar = usedAr;
          p.sales_available = sales;
          p.rental_available = rental;
        }
      } else {
        const newProduct = {
          id: db.products.length ? Math.max(...db.products.map(x => x.id)) + 1 : 1,
          sku: sku,
          slug: nameEn.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          class_code: classCode,
          cat_slug: catSlug,
          brand_name: classCode === 'LOCAL' ? 'Saudi Master' : 'ULMA Construction',
          name_en: nameEn,
          name_ar: nameAr,
          short_summary_en: sumEn,
          short_summary_ar: sumAr,
          what_is_it_en: whatEn,
          what_is_it_ar: whatAr,
          what_is_used_for_en: usedEn,
          what_is_used_for_ar: usedAr,
          sales_available: sales,
          rental_available: rental,
          main_image: imgUrl,
          hero_image: imgUrl,
          key_advantages_en: ["Engineered for heavy civil load requirements", "High-frequency reuse durability", "Full safety compliance"],
          key_advantages_ar: ["مصمم لمقاومة الأحمال الإنشائية الكبرى", "متانة فائقة للاستخدام المتكرر", "مطابق لأعلى معايير السلامة"],
          technical_specs: { "load_class": "Heavy Duty", "steel_spec": "S355JR", "certification": "SASO / EN 12810" }
        };
        db.products.push(newProduct);
      }

      localStorage.setItem('sm_products_override', JSON.stringify(db.products));
      closeProductModal();
      renderCurrentTab();
      alert('Product saved and synchronized with public catalog!');
    }

    function saveHeroConfig(e) {

    function toggleSection(secId, isVisible) {
      let sections = defaultSections;
      if (localStorage.getItem('sm_sections_override')) {
        try { sections = JSON.parse(localStorage.getItem('sm_sections_override')); } catch(e) {}
      }
      const s = sections.find(x => x.id === secId);
      if (s) s.visible = isVisible;
      localStorage.setItem('sm_sections_override', JSON.stringify(sections));
      renderCurrentTab();
    }

              <div>

    function saveGeometryForm(e, id) {
      e.preventDefault();

    function saveProcessForm(e, stepNumber) {
      e.preventDefault();
      const pr = db.processes.find(x => x.step_number === stepNumber);
      if (pr) {
        pr.hero_image = document.getElementById('proc_image').value;
        pr.name_en = document.getElementById('proc_name_en').value;
        pr.name_ar = document.getElementById('proc_name_ar').value;
        pr.summary_en = document.getElementById('proc_sum_en').value;
        pr.summary_ar = document.getElementById('proc_sum_ar').value;
        localStorage.setItem('sm_processes_override', JSON.stringify(db.processes));
        document.getElementById('procModal').remove();
        renderCurrentTab();
        alert('Manufacturing process updated successfully!');

    function updateLead(id, status) {
      const l = db.leads.find(x => x.id === id);
      if (l) {
        l.status = status;
        alert(`Lead ticket ${l.ticket_number} status set to ${status}.`);
      }
    }

    function saveSiteSettings(e) {
      e.preventDefault();
      db.site.company_name_en = document.getElementById('cfg_comp_en').value;
      db.site.company_name_ar = document.getElementById('cfg_comp_ar').value;
      db.site.phone = document.getElementById('cfg_phone').value;
      db.site.whatsapp = document.getElementById('cfg_wa').value;
      db.site.email = document.getElementById('cfg_email').value;
      db.site.address_en = document.getElementById('cfg_addr_en').value;
      localStorage.setItem('sm_site_override', JSON.stringify(db.site));
      alert('Corporate settings updated and persisted successfully!');
    }

    function resetFactoryDefaults() {
      if (confirm('Are you sure you want to reset all configurations to factory defaults? All custom edits will be cleared.')) {
        localStorage.removeItem('sm_products_override');
        localStorage.removeItem('sm_hero_override');
        localStorage.removeItem('sm_sections_override');
        localStorage.removeItem('sm_geometries_override');
        localStorage.removeItem('sm_projects_override');
        localStorage.removeItem('sm_processes_override');
        localStorage.removeItem('sm_site_override');
        location.reload();
      }
    }
